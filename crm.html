<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTR CRM | Panel de Clientes</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root { --green:#004E5E; --orange:#F08100; --wine:#671243; --white:#F6F6F6; --dark:#00141b; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--dark); color:var(--white); font-family:'Montserrat',sans-serif; min-height:100vh; }

/* LOGIN */
#login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:1.5rem; padding:2rem; text-align:center; }
#login-screen h1 { font-size:2rem; font-weight:900; text-transform:uppercase; letter-spacing:0.05em; }
#login-screen h1 span { color:var(--orange); }
#login-screen p { color:rgba(246,246,246,0.6); font-size:0.85rem; max-width:320px; }
.google-btn { background:var(--orange); color:#000; border:none; border-radius:8px; padding:0.9rem 2rem; font-weight:800; font-size:0.85rem; cursor:pointer; text-transform:uppercase; letter-spacing:0.08em; font-family:'Montserrat',sans-serif; }
.google-btn:hover { transform:scale(1.03); }
#login-error { color:#ff6b6b; font-size:0.8rem; display:none; }

/* PANEL */
#panel { display:none; }
.topbar { background:var(--green); padding:1rem 1.5rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
.topbar h1 { font-size:1.1rem; font-weight:900; text-transform:uppercase; }
.topbar h1 span { color:var(--orange); }
.topbar .spacer { flex:1; }
.topbar button { background:none; border:1px solid rgba(255,255,255,0.4); color:#fff; border-radius:6px; padding:0.4rem 0.9rem; font-size:0.72rem; cursor:pointer; font-family:'Montserrat',sans-serif; }
.stats { display:flex; gap:1rem; padding:1.2rem 1.5rem; flex-wrap:wrap; }
.stat { background:rgba(0,78,94,0.4); border:1px solid rgba(240,129,0,0.3); border-radius:10px; padding:0.9rem 1.4rem; min-width:130px; }
.stat .num { font-size:1.6rem; font-weight:900; color:var(--orange); }
.stat .lbl { font-size:0.62rem; text-transform:uppercase; letter-spacing:0.12em; color:rgba(246,246,246,0.6); }
.leads { padding:0 1.5rem 3rem; display:flex; flex-direction:column; gap:0.8rem; }
.lead { background:rgba(246,246,246,0.05); border:1px solid rgba(246,246,246,0.12); border-radius:10px; padding:1rem 1.2rem; }
.lead.nuevo { border-left:4px solid var(--orange); }
.lead-top { display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap; }
.lead-name { font-weight:800; font-size:1rem; }
.lead-date { font-size:0.68rem; color:rgba(246,246,246,0.5); }
.lead-top select { margin-left:auto; background:var(--dark); color:var(--white); border:1px solid rgba(240,129,0,0.5); border-radius:6px; padding:0.3rem 0.5rem; font-size:0.72rem; font-family:'Montserrat',sans-serif; }
.lead-info { display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:0.6rem; font-size:0.78rem; color:rgba(246,246,246,0.85); }
.lead-info a { color:var(--orange); text-decoration:none; }
.lead-actions { margin-top:0.7rem; display:flex; gap:0.8rem; }
.lead-actions button { background:none; border:none; color:var(--orange); font-size:0.72rem; cursor:pointer; font-family:'Montserrat',sans-serif; text-decoration:underline; }
.lead-actions button.del { color:#ff6b6b; }
.convo { display:none; margin-top:0.8rem; background:rgba(0,0,0,0.35); border-radius:8px; padding:0.8rem; font-size:0.74rem; line-height:1.5; max-height:260px; overflow-y:auto; }
.convo .c-user { color:var(--orange); margin-top:0.4rem; }
.convo .c-bot { color:rgba(246,246,246,0.8); margin-top:0.4rem; }
#empty { text-align:center; color:rgba(246,246,246,0.4); padding:3rem; font-size:0.85rem; }
@media (max-width:600px) { .lead-top select { margin-left:0; width:100%; } }
</style>
</head>
<body>

<div id="login-screen">
  <h1>On The Rocks <span>CRM</span></h1>
  <p>Panel privado de clientes y leads. Inicia sesión con la cuenta de Google de OTR.</p>
  <button class="google-btn" onclick="login()">Iniciar sesión con Google</button>
  <div id="login-error">Esta cuenta no tiene acceso al panel.</div>
</div>

<div id="panel">
  <div class="topbar">
    <h1>OTR <span>CRM</span></h1>
    <div class="spacer"></div>
    <button onclick="cargarLeads()">🔄 Actualizar</button>
    <button onclick="logout()">Salir</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="st-total">0</div><div class="lbl">Leads totales</div></div>
    <div class="stat"><div class="num" id="st-nuevos">0</div><div class="lbl">Nuevos</div></div>
    <div class="stat"><div class="num" id="st-semana">0</div><div class="lbl">Esta semana</div></div>
  </div>
  <div class="leads" id="leads-list"></div>
  <div id="empty" style="display:none;">Todavía no hay leads. Cuando alguien deje sus datos en el chatbot, aparecerán aquí. 🍹</div>
</div>

<script>
const ADMIN_EMAIL = "ontherocksrva@gmail.com";
const ESTADOS = ["Nuevo","Contactado","Cotizado","Cerrado ✅","No interesado"];

firebase.initializeApp({
  apiKey: "AIzaSyAv5s7pYbxQZ8ghbheZoz9bs-h7B7dqtjg",
  authDomain: "otr-crm-77dc2.firebaseapp.com",
  projectId: "otr-crm-77dc2",
  storageBucket: "otr-crm-77dc2.firebasestorage.app",
  messagingSenderId: "1060934914326",
  appId: "1:1060934914326:web:e0040864d8891405b48037"
});
const db = firebase.firestore();
const auth = firebase.auth();

function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => alert("Error: " + e.message));
}
function logout() { auth.signOut(); }

auth.onAuthStateChanged(user => {
  const err = document.getElementById('login-error');
  if (user && user.email === ADMIN_EMAIL) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    cargarLeads();
  } else {
    if (user) { err.style.display = 'block'; auth.signOut(); }
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('panel').style.display = 'none';
  }
});

async function cargarLeads() {
  const list = document.getElementById('leads-list');
  list.innerHTML = '';
  const snap = await db.collection('leads').orderBy('creado','desc').limit(200).get();
  const ahora = Date.now(), semana = 7*24*60*60*1000;
  let total = 0, nuevos = 0, estaSemana = 0;

  snap.forEach(doc => {
    const d = doc.data(); total++;
    if (d.estado === 'Nuevo') nuevos++;
    const ts = d.creado && d.creado.toDate ? d.creado.toDate() : null;
    if (ts && (ahora - ts.getTime()) < semana) estaSemana++;

    const div = document.createElement('div');
    div.className = 'lead' + (d.estado === 'Nuevo' ? ' nuevo' : '');

    const fechaStr = ts ? ts.toLocaleDateString('es-US',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    const opts = ESTADOS.map(e => `<option ${e===d.estado?'selected':''}>${e}</option>`).join('');

    div.innerHTML = `
      <div class="lead-top">
        <span class="lead-name">${esc(d.nombre)||'(sin nombre)'}</span>
        <span class="lead-date">${fechaStr} · ${d.idioma==='en'?'🇺🇸':'🇲🇽'}</span>
        <select onchange="cambiarEstado('${doc.id}', this.value)">${opts}</select>
      </div>
      <div class="lead-info">
        ${d.telefono?`<span>📱 <a href="https://wa.me/1${esc(d.telefono).replace(/\D/g,'')}" target="_blank">${esc(d.telefono)}</a></span>`:''}
        ${d.email?`<span>✉️ <a href="mailto:${esc(d.email)}">${esc(d.email)}</a></span>`:''}
        ${d.tipoEvento?`<span>🎉 ${esc(d.tipoEvento)}</span>`:''}
        ${d.fechaEvento?`<span>📅 ${esc(d.fechaEvento)}</span>`:''}
        ${d.invitados?`<span>👥 ${esc(d.invitados)} invitados</span>`:''}
      </div>
      <div class="lead-actions">
        <button onclick="verConvo(this)">💬 Ver conversación</button>
        <button class="del" onclick="borrarLead('${doc.id}')">Eliminar</button>
      </div>
      <div class="convo">${convoHTML(d.conversacion)}</div>`;
    list.appendChild(div);
  });

  document.getElementById('st-total').textContent = total;
  document.getElementById('st-nuevos').textContent = nuevos;
  document.getElementById('st-semana').textContent = estaSemana;
  document.getElementById('empty').style.display = total ? 'none' : 'block';
}

function esc(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function convoHTML(json) {
  try {
    const msgs = JSON.parse(json || '[]');
    if (!msgs.length) return '<em>Sin conversación guardada.</em>';
    return msgs.map(m => `<div class="${m.role==='user'?'c-user':'c-bot'}"><b>${m.role==='user'?'Cliente':'Rocky'}:</b> ${esc(m.content)}</div>`).join('');
  } catch(e) { return '<em>Sin conversación guardada.</em>'; }
}

function verConvo(btn) {
  const c = btn.closest('.lead').querySelector('.convo');
  c.style.display = c.style.display === 'block' ? 'none' : 'block';
}

async function cambiarEstado(id, estado) {
  await db.collection('leads').doc(id).update({ estado });
  cargarLeads();
}

async function borrarLead(id) {
  if (!confirm('¿Eliminar este lead? No se puede deshacer.')) return;
  await db.collection('leads').doc(id).delete();
  cargarLeads();
}
</script>
</body>
</html>
